# 单个数据库的 Alembic 迁移配置。

[alembic]
# 迁移脚本目录。%(here)s 表示当前配置文件所在目录，路径通常使用正斜杠。
script_location = %(here)s/migrations

# 迁移文件名模板。可启用下面的示例加入日期、时间或按日期划分子目录。
# 按子目录组织时还需启用 recursive_version_locations。
# 模板参数说明：https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# 启动时加入 Python 模块搜索路径的目录。多个路径的分隔方式由 path_separator 决定。
prepend_sys_path = .


# 迁移文件内容及文件名使用的时区；留空表示本地时间。
# 指定时区时需要 tzdata，可安装 alembic[tz]；时区字符串会交给 ZoneInfo。
# timezone =

# 迁移文件名中 slug（描述部分）的最大字符数。
# truncate_slug_length = 40

# 是否在执行 revision 命令时始终加载迁移环境，即使未启用自动生成。
# revision_environment = false

# 是否允许把没有对应 .py 源文件的 .pyc、.pyo 文件识别为迁移版本。
# sourceless = false

# 迁移版本目录，默认是 <script_location>/versions。
# 使用多个目录时，新建首个版本需指定 --version-path；目录分隔符由 path_separator 决定。
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# 路径列表的分隔方式，同时适用于 version_locations 和 prepend_sys_path。
# os 使用当前操作系统的路径分隔符。也可以指定冒号、分号、space（空格）或 newline（换行）。
# 旧配置若省略此项，version_locations 会回退到 version_path_separator 或空格、逗号分隔；
# prepend_sys_path 则回退到空格、逗号或冒号分隔。下面保留可选写法供参考。
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
path_separator = os

# 是否递归查找各迁移版本目录中的源文件；该选项从 Alembic 1.10 开始提供。
# recursive_version_locations = false

# 从 script.py.mako 模板生成迁移文件时使用的文本编码。
# output_encoding = utf-8

# 数据库连接地址的占位配置。
# 本项目的 migrations/env.py 会用 .env 中的配置覆盖此值，无需在这里填写实际密码。
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# 生成迁移文件后可执行的脚本或 Python 函数，下面保留格式化和检查的可选示例。

# 通过 console_scripts 调用 black，对新生成的迁移文件执行格式化。
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# 通过 module 调用 ruff，对新生成的迁移文件进行检查并尝试自动修复。
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# 也可通过 exec 调用 PATH 中的 ruff 可执行文件。
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# 迁移过程的日志配置，由 migrations/env.py 加载。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
