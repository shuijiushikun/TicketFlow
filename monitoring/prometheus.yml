global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ticketcore-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: api

  - job_name: ticketcore-worker
    metrics_path: /
    static_configs:
      - targets: ["worker:8001"]
        labels:
          component: worker
